services:
  # -------------------------------------------------------------------
  # 1. Backend API Service
  # -------------------------------------------------------------------
  - type: web
    name: salesperson-erp-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build:shared && cd api && npx prisma generate && npm run build
    startCommand: cd api && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://example.com,https://admin.example.com
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

  # -------------------------------------------------------------------
  # 2. Admin Web Dashboard
  # -------------------------------------------------------------------
  - type: web
    name: salesperson-erp-admin
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build:shared && cd admin && npm run build
    startCommand: cd admin && npx next start -p 3000
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://api.example.com
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://api.example.com
      - key: API_URL
        value: https://api.example.com

  # -------------------------------------------------------------------
  # 3. User Web App (Expo Static Web SPA)
  # -------------------------------------------------------------------
  - type: web
    name: salesperson-erp-app
    runtime: static
    buildCommand: npm install && npm run build:shared && npm run build --workspace=@erp/app
    staticPublishPath: ./app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://api.example.com
      - key: EXPO_PUBLIC_DEFAULT_TIMEZONE
        value: Asia/Kolkata
